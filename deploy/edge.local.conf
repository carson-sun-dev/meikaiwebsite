# 本地预演专用 nginx 配置 — 端到端跑 deploy/docker-compose.prod.yml 但无 SSL。
# 用法:cp edge.local.conf edge.active.conf 后启 compose;浏览器访问 http://localhost
#
# 与 edge.ssl.conf 的差异:
# - 删 listen 443 ssl + ssl_certificate*
# - 删 HSTS / 301 jump
# - server_name 改 localhost(本机访问;若用 hosts 自定义域名同样可加)

server {
  listen 80;
  server_name localhost;

  # 安全 header 本地也带上,验证 web 端不会被它们误伤
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ---- 网站主流量(SPA + /api/leads/* 由 web 容器内 nginx 分发到 backend)----
  location / {
    proxy_pass http://web:80;
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
}
